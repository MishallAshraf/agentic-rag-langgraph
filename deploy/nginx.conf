# nginx in front of the API copies (Lampus Phase 1, Step 9; course topic 2, load balancing).
#
#   docker compose --profile scale up -d nginx     # listens on port 8000
#
# The copies run on ports 8001-8003 on the same machine (loadtest/start_copies.sh 3).
# nginx runs with the host's network (docker-compose.yml), so 127.0.0.1 here is that machine.

upstream lampus_api {
    # Send each request to the copy with the fewest open requests. Chat replies stream
    # for seconds, so counting open requests spreads load better than taking turns.
    least_conn;
    # A copy that fails to answer once is left out for 10 s, then tried again.
    # Open-source nginx has no active health checks: it notices a dead copy when a request to it fails.
    server 127.0.0.1:8001 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:8002 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:8003 max_fails=1 fail_timeout=10s;
    keepalive 32;  # reuse connections to the copies instead of opening one per request
}

server {
    listen 8000;
    client_max_body_size 61m;  # bot uploads: up to 60 MB of files (engine/builds.py)

    location / {
        proxy_pass http://lampus_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The copies see nginx's address; this header carries the student's own, which
        # the sign-in limiter counts by. uvicorn trusts it only from 127.0.0.1.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass streamed replies (server-sent events) on as they come, not when they end.
        proxy_buffering off;
        proxy_read_timeout 300s;
        # If a copy refuses the connection or doesn't answer, try the next one. nginx never
        # retries a POST that already reached a copy, so a message is never sent twice.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 3;
    }
}
