# Who may connect to the primary Postgres (docker-compose.yml points the db service here).
# The same as the image's default, plus one line: the read replica (Lampus Phase 1, Step 9)
# connects over the network for replication, which "all" databases does not cover.
# TYPE  DATABASE     USER  ADDRESS       METHOD
local   all          all                 trust
host    all          all   127.0.0.1/32  trust
host    all          all   ::1/128       trust
local   replication  all                 trust
host    all          all   all           scram-sha-256
host    replication  all   all           scram-sha-256
