# Generated with the bot: domain questions from its documents, plus platform cases.
- id: gen-1
  category: paraphrased
  generated: true
  turns:
  - How does the system let a person sign off before certain risky tools are executed, and what happens if they
    say no?
  key_points:
  - Tools flagged in the bot config as needing approval route to a human_approval node that pauses the graph via
    interrupt()
  - Approval runs the tools; rejection answers each tool call with a rejection and the agent continues
  - Pausing requires a checkpointer (in-memory, new thread per question until Step 5)
  expected_behaviour: Answers from the documents and cites the source.
  expected_sources:
  - 0008-human-approval-enforced-by-the-graph.md, section "Decision"
  must_call:
  - search_knowledge
- id: gen-2
  category: paraphrased
  generated: true
  turns:
  - Why didn't the team just store finished replies for reuse, and what did they cache instead?
  key_points:
  - Answers depend on conversation context like follow-ups and the summary, and a wrong cached answer would be repeated
    to everyone
  - They cache the graded search instead, keeping answers fresh while skipping the expensive part
  - Anthropic prompt caching showed cache_read 0 because prompts (900–1,900 tokens) are below the minimum cacheable
    length
  expected_behaviour: Answers from the documents and cites the source.
  expected_sources:
  - 0014-reliability-cost-and-caching.md, section "Alternatives considered"
  must_call:
  - search_knowledge
- id: gen-3
  category: paraphrased
  generated: true
  turns:
  - What are the upsides and downsides of routing all model calls through a single gateway service instead of connecting
    to each provider directly?
  key_points:
  - One key gives access to many models; switching is just changing the OPENROUTER_MODEL setting
  - It costs per token and adds another service that can fail, add latency, and see prompts
  - Provider-specific features may be delayed or unavailable via the OpenAI-compatible format
  expected_behaviour: Answers from the documents and cites the source.
  expected_sources:
  - 0005-llm-provider.md, section "Consequences"
  must_call:
  - search_knowledge
- id: gen-4
  category: paraphrased
  generated: true
  turns:
  - What are the drawbacks of the hybrid retrieval approach that was chosen, such as speed and maintenance issues?
  key_points:
  - Each search takes about 0.7 s versus about 20 ms before
  - The test set is tiny (one question equals 0.08 hit@4), so the ranking may not hold on a larger set
  - The BM25 index must be rebuilt when the collection changes, and PyMuPDF's AGPL license may require a commercial
    license or different parser
  expected_behaviour: Answers from the documents and cites the source.
  expected_sources:
  - 0010-hybrid-retrieval-with-reranking.md, section "Consequences"
  must_call:
  - search_knowledge
- id: not-covered
  category: not_covered
  generated: true
  turns:
  - How is user authentication and rate limiting handled when the API is deployed to production?
  expected_behaviour: Says the documents do not cover this, without answering from general knowledge.
