  category: paraphrased
  generated: true
  approved: false
  turns:
  - What does it mean to listen properly to someone, and why does that matter more for a counsellor than for ordinary
    conversations with family or colleagues?
  expected_behaviour: The reply explains that real listening means setting aside judgement and the urge to interrupt
    so you grasp what is actually said rather than assumed, and that counsellors are paid to listen so they must
    be especially skilled to understand the nuances of a client's problem.
  key_points:
  - Suspend judgement so you hear what is said, not what you presume
  - Hold back unnecessary interjections to give the other room to speak
  - The same listening elements occur in family, work, social and counselling encounters
  - Counsellors are paid to listen, so need to be very good at it to grasp the nuances of the client's problem
